workflows:
  android_debug:
    name: BEFCC Android Debug APK
    max_build_duration: 60

    environment:
      java: 17

    scripts:
      - name: Generate Gradle Wrapper
        script: |
          gradle wrapper --gradle-version 9.3.1

      - name: Make Gradle wrapper executable
        script: |
          chmod +x ./gradlew

      - name: Build BEFCC Debug APK
        script: |
          ./gradlew clean assembleDebug --no-daemon

    artifacts:
      - app/build/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - mdhumayun1980640@gmail.com
