workflows:
  android_debug:
    name: BEFCC Android Debug APK
    max_build_duration: 60

    scripts:
      - name: Make Gradle wrapper executable
        script: |
          chmod +x ./gradlew

      - name: Build BEFCC Debug APK
        script: |
          ./gradlew clean assembleDebug --no-daemon

    artifacts:
      - app/build/outputs/apk/debug/*.apk

    publishing:
